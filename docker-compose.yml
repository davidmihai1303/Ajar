services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: netcheck-app
    # host network: lets the app reach the scanner agent on 127.0.0.1 (Linux).
    # By default the web server binds to 127.0.0.1 only, so it is NOT visible on the hotspot.
    # LAN test mode (no login!): in .env set NETCHECK_BIND_HOST=0.0.0.0 and
    # NETCHECK_ALLOWED_HOSTS=<pi name or IP>. The scanner agent always stays on 127.0.0.1.
    network_mode: host
    command: ["uvicorn", "netcheck.api.app:app", "--host", "${NETCHECK_BIND_HOST:-127.0.0.1}", "--port", "8001"]
    env_file:
      - path: .env
        required: false
    environment:
      - NETCHECK_DB=/data/db/netcheck.sqlite
      - NETCHECK_SCANS_DIR=/data/scans
    volumes:
      - /var/lib/netcheck/scans:/data/scans:ro   # XML written by the root wrapper
      - ./data:/data/db                          # SQLite history (local only)
      - ./input:/data/input                      # Validation / Test Set folders
    restart: unless-stopped
