[project]
name = "netcheck"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "defusedxml>=0.7",
  "fastapi>=0.115.12",
  "pydantic>=2",
  "python-multipart>=0.0.20",
  "uvicorn>=0.29",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
netcheck = "netcheck.cli:main"

[tool.setuptools.packages.find]
include = ["netcheck*"]

[tool.setuptools.package-data]
netcheck = ["explain/texts/*.yaml", "api/static/**/*"]
