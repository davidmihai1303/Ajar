<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1300" viewBox="0 0 1400 1300" font-family="Inter, DejaVu Sans, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 15px; fill: #475569; }
      .row { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
      .rt { font-size: 18px; font-weight: 600; fill: #0f172a; }
      .rd { font-size: 15px; fill: #475569; }
      .tag { font-size: 14px; font-weight: 600; }
      .num { font-size: 16px; font-weight: 700; fill: #ffffff; }
      .lbl { font-size: 15px; font-weight: 600; fill: #334155; }
      .arrow { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arr); }
    </style>
  </defs>

  <rect width="1400" height="1300" fill="#ffffff"/>
  <text x="700" y="48" text-anchor="middle" font-size="28" font-weight="800" fill="#0f172a">Arhitectura tool-ului – Secure Networks, Simply Explained</text>

  <!-- ===== Inputs (left) ===== -->
  <rect x="50" y="165" width="290" height="90" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="195" y="203" text-anchor="middle" class="rt">UI / CLI</text>
  <text x="195" y="230" text-anchor="middle" class="rd">utilizatorul pornește scanarea</text>
  <path d="M340,210 L428,210" class="arrow"/>

  <rect x="50" y="410" width="290" height="110" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="195" y="447" text-anchor="middle" class="rt">Folder de XML-uri</text>
  <text x="195" y="474" text-anchor="middle" class="rd">Validation / Test Set</text>
  <text x="195" y="498" text-anchor="middle" class="rd">fără rețea · FR-05</text>
  <path d="M340,465 L428,465" class="arrow"/>

  <!-- ===== Block A: live scan ===== -->
  <rect x="430" y="80" width="580" height="260" rx="18" fill="#eef2ff" stroke="#6366f1" stroke-width="2.5"/>
  <text x="455" y="113" class="title">Scanare live</text>

  <rect x="450" y="130" width="540" height="56" rx="10" class="row"/>
  <circle cx="478" cy="158" r="15" fill="#6366f1"/><text x="478" y="164" text-anchor="middle" class="num">1</text>
  <text x="505" y="164" class="rt">Detectare rețea</text>
  <text x="972" y="164" text-anchor="end" class="tag" fill="#4f46e5">FR-01</text>

  <rect x="450" y="196" width="540" height="56" rx="10" class="row"/>
  <circle cx="478" cy="224" r="15" fill="#6366f1"/><text x="478" y="230" text-anchor="middle" class="num">2</text>
  <text x="505" y="230" class="rt">Gardă + --confirm</text>
  <text x="972" y="230" text-anchor="end" class="tag" fill="#4f46e5">FR-02</text>

  <rect x="450" y="262" width="540" height="56" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="2" stroke-dasharray="7 5"/>
  <circle cx="478" cy="290" r="15" fill="#6366f1"/><text x="478" y="296" text-anchor="middle" class="num">3</text>
  <text x="505" y="296" class="rt">Scaner (nmap)</text>
  <text x="972" y="296" text-anchor="end" class="tag" fill="#be123c">singurul pas cu privilegii</text>

  <!-- privilege note -->
  <path d="M1000,290 L1050,290" stroke="#e11d48" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="1050" y="250" width="300" height="80" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
  <text x="1200" y="283" text-anchor="middle" class="lbl" fill="#9f1239">Privilegii de rețea</text>
  <text x="1200" y="308" text-anchor="middle" class="rd">setcap / sudo · NFR-04</text>

  <!-- A -> B -->
  <path d="M720,340 L720,388" class="arrow"/>
  <rect x="733" y="352" width="46" height="24" rx="6" fill="#f1f5f9"/>
  <text x="756" y="369" text-anchor="middle" class="lbl">XML</text>

  <!-- ===== Block B: analyzer ===== -->
  <rect x="430" y="390" width="580" height="210" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5"/>
  <text x="455" y="423" class="title">Analizor</text>
  <text x="560" y="423" class="sub">determinist, fără LLM</text>

  <rect x="450" y="440" width="540" height="66" rx="10" class="row"/>
  <circle cx="478" cy="473" r="15" fill="#10b981"/><text x="478" y="479" text-anchor="middle" class="num">4</text>
  <text x="505" y="467" class="rt">Parser sigur</text>
  <text x="505" y="490" class="rd">defusedxml · fișier stricat → ERROR</text>
  <text x="972" y="479" text-anchor="end" class="tag" fill="#047857">NFR-03</text>

  <rect x="450" y="516" width="540" height="66" rx="10" class="row"/>
  <circle cx="478" cy="549" r="15" fill="#10b981"/><text x="478" y="555" text-anchor="middle" class="num">5</text>
  <text x="505" y="543" class="rt">Reguli + scor</text>
  <text x="505" y="566" class="rd">catalogul oficial · max(0, 100 − Σ puncte)</text>
  <text x="972" y="555" text-anchor="end" class="tag" fill="#047857">FR-06 · FR-09</text>

  <!-- B -> CSV -->
  <path d="M1010,549 L1048,549" class="arrow"/>
  <rect x="1050" y="500" width="300" height="100" rx="12" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
  <text x="1200" y="536" text-anchor="middle" class="rt">findings.csv</text>
  <text x="1200" y="562" text-anchor="middle" class="rt">scores.csv</text>
  <text x="1200" y="586" text-anchor="middle" class="rd">FR-15 · 30% din notă</text>

  <!-- B -> C -->
  <path d="M720,600 L720,648" class="arrow"/>

  <!-- ===== Block C: history ===== -->
  <rect x="430" y="650" width="580" height="110" rx="18" fill="#fff7ed" stroke="#f59e0b" stroke-width="2.5"/>
  <rect x="450" y="668" width="540" height="74" rx="10" class="row"/>
  <circle cx="478" cy="705" r="15" fill="#f59e0b"/><text x="478" y="711" text-anchor="middle" class="num">6</text>
  <text x="505" y="699" class="rt">Istoric (SQLite)</text>
  <text x="505" y="723" class="rd">diff cu scanarea anterioară · alerte · șterge istoricul</text>
  <text x="972" y="711" text-anchor="end" class="tag" fill="#b45309">FR-10 · FR-13</text>

  <!-- C -> D -->
  <path d="M720,760 L720,808" class="arrow"/>

  <!-- ===== Block D: explanations ===== -->
  <rect x="430" y="810" width="580" height="200" rx="18" fill="#fdf2f8" stroke="#ec4899" stroke-width="2.5"/>
  <text x="455" y="843" class="title">Explicații și remedieri</text>

  <rect x="450" y="858" width="540" height="66" rx="10" class="row"/>
  <circle cx="478" cy="891" r="15" fill="#ec4899"/><text x="478" y="897" text-anchor="middle" class="num">7</text>
  <text x="505" y="885" class="rt">Explicații statice RO/EN</text>
  <text x="505" y="908" class="rd">obligatorii · rezervă dacă LLM-ul nu merge</text>
  <text x="972" y="897" text-anchor="end" class="tag" fill="#be185d">FR-07 · FR-08</text>

  <rect x="450" y="932" width="540" height="66" rx="10" fill="#ffffff" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="7 5"/>
  <circle cx="478" cy="965" r="15" fill="#ec4899"/><text x="478" y="971" text-anchor="middle" class="num">8</text>
  <text x="505" y="959" class="rt">LLM (opțional)</text>
  <text x="505" y="982" class="rd">personalizare + Q&amp;A · ancorat în scanare</text>
  <text x="972" y="971" text-anchor="end" class="tag" fill="#be185d">FR-12 · NFR-06</text>

  <!-- D -> E -->
  <path d="M720,1010 L720,1058" class="arrow"/>

  <!-- ===== Block E: UI ===== -->
  <rect x="430" y="1060" width="580" height="110" rx="18" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2.5"/>
  <rect x="450" y="1078" width="540" height="74" rx="10" class="row"/>
  <circle cx="478" cy="1115" r="15" fill="#0ea5e9"/><text x="478" y="1121" text-anchor="middle" class="num">9</text>
  <text x="505" y="1109" class="rt">UI</text>
  <text x="505" y="1133" class="rd">scor · cel mai periculos dispozitiv · fix-uri · istoric</text>
  <text x="972" y="1121" text-anchor="end" class="tag" fill="#0369a1">FR-11</text>

  <!-- unprivileged bracket -->
  <path d="M1050,400 L1050,480" stroke="none"/>
  <path d="M1030,620 L1045,620 L1045,1170 L1030,1170" stroke="#64748b" stroke-width="2" fill="none"/>
  <text x="1065" y="900" class="lbl" fill="#334155">Rulează ca</text>
  <text x="1065" y="924" class="lbl" fill="#334155">utilizator normal</text>
  <text x="1065" y="950" class="rd">analizor, istoric,</text>
  <text x="1065" y="972" class="rd">explicații, UI</text>

  <!-- build order -->
  <rect x="50" y="1205" width="1300" height="64" rx="14" fill="#0f172a"/>
  <text x="700" y="1245" text-anchor="middle" font-size="19" font-weight="600" fill="#ffffff">Ordinea de construcție:   4 + 5 (cu CSV)  →  1 – 3  →  7  →  6  →  9  →  8</text>
</svg>
